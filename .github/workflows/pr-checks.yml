---
name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Use Cloudflare's npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=999

      - name: Check Prettier formatting
        run: npm run format:check || echo "Prettier formatting issues found but allowing warnings"

      - name: Run TypeScript check
        run: npx next typegen && npx tsc --noEmit

      - name: Build Cloudflare Worker
        run: npm run build:worker
